name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y etcd-server etcd-client
          echo "S3_TEST_ARTIFACTS=$RUNNER_TEMP/s3-artifacts" >> "$GITHUB_ENV"
          echo "S3_TEST_ETCD=/usr/bin/etcd" >> "$GITHUB_ENV"

      # The eviction scenario mounts a small tmpfs inside an unprivileged
      # user namespace, which Ubuntu confines by default.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rm true && echo "user namespaces ok"

      - name: Format
        run: test -z "$(gofmt -l *.go)" || { gofmt -d *.go; exit 1; }

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=s3chaos ./...
        env:
          GOFLAGS: -mod=readonly

      - name: Build and test
        run: |
          ./build -k -j 4 test
          ./build s3

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-test-failure
          path: ${{ runner.temp }}/s3-artifacts
          retention-days: 7

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc etcd-server etcd-client
          echo "S3_TEST_ARTIFACTS=$RUNNER_TEMP/s3-artifacts" >> "$GITHUB_ENV"
          echo "S3_TEST_ETCD=/usr/bin/etcd" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run all e2e tests with the race detector
        run: ./build -k -j 2 -Drace test

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-race-failure
          path: ${{ runner.temp }}/s3-artifacts
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y etcd-server etcd-client
          echo "S3_TEST_ARTIFACTS=$RUNNER_TEMP/s3-artifacts" >> "$GITHUB_ENV"
          echo "S3_TEST_ETCD=/usr/bin/etcd" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the tests against the instrumented binary
        run: ./build -k -j 4 -Dcoverage coverage

      # Reported by the job that puts the runs together, not here: one run is
      # only part of what the binary does.
      - name: Save the coverage profile
        if: ${{ !cancelled() && hashFiles('.build/coverage.out') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-coverage-go-plain
          path: .build/coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-coverage-failure
          path: ${{ runner.temp }}/s3-artifacts
          retention-days: 7

  chaos:
    name: Chaos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y etcd-server etcd-client
          echo "S3_TEST_ARTIFACTS=$RUNNER_TEMP/s3-artifacts" >> "$GITHUB_ENV"
          echo "S3_TEST_ETCD=/usr/bin/etcd" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The same scenarios against a binary the kernel refuses now and then.
      # Instrumented, because the paths the refusals walk are exactly the ones
      # the ordinary suite never reaches.
      - name: Run all e2e tests against a binary that gets refused
        run: ./build -k -j 4 -Dcoverage chaos coverage-chaos

      - name: Save the coverage profile
        if: ${{ !cancelled() && hashFiles('.build/coverage-chaos.out') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-coverage-go-chaos
          path: .build/coverage-chaos.out
          if-no-files-found: error
          retention-days: 7

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-chaos-failure
          path: ${{ runner.temp }}/s3-artifacts
          retention-days: 7

  aggregate:
    name: Coverage aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [coverage, chaos]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the profiles of every run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: s3-coverage-go-*
          path: ${{ runner.temp }}/profiles

      - name: Add the runs up
        run: |
          set -o pipefail
          python3 dev/merge_coverage.py \
            --output "$RUNNER_TEMP/coverage.out" \
            --minimum 88 \
            "$RUNNER_TEMP"/profiles/s3-coverage-go-*/coverage*.out | tee "$RUNNER_TEMP/summary.txt"
          {
            echo "## Coverage"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Save the merged profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-coverage-go
          path: ${{ runner.temp }}/coverage.out
          if-no-files-found: error
          retention-days: 7
